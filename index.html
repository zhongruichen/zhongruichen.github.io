<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamePrompt Forge - AI 游戏复刻提示词生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            background:
                radial-gradient(circle at 10% 10%, rgba(59, 130, 246, 0.12), transparent 30%),
                radial-gradient(circle at 85% 15%, rgba(139, 92, 246, 0.10), transparent 32%),
                radial-gradient(circle at 50% 90%, rgba(14, 165, 233, 0.08), transparent 35%);
        }

        .mono-font {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        .game-chip {
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .game-chip:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .game-chip.active {
            background-color: #3b82f6;
            border-color: #60a5fa;
            color: white;
        }
        /* Fusion Mode Selected Style */
        .game-chip.fusion-selected {
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            border-color: #a78bfa;
            color: white;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.4);
        }
        .game-chip.fusion-selected::after {
            content: '\f058'; /* FontAwesome check-circle */
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            top: 4px;
            right: 4px;
            font-size: 10px;
            opacity: 0.8;
        }

        .level-card {
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #334155;
        }
        .level-card:hover {
            border-color: #60a5fa;
            background-color: #1e293b;
        }
        .level-card.active {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            border-color: #3b82f6;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.3);
        }
        /* Special style for Raw Template */
        .level-card[data-id="raw"] {
            border-style: dashed;
        }
        .level-card[data-id="raw"].active {
            background: linear-gradient(135deg, #475569 0%, #334155 100%);
            border-color: #94a3b8;
            box-shadow: none;
        }

        .category-btn.active {
            border-bottom: 2px solid #3b82f6;
            color: #3b82f6;
        }

        /* Custom Checkbox */
        .custom-checkbox {
            appearance: none;
            background-color: #1e293b;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.15em;
            height: 1.15em;
            border: 1px solid #475569;
            border-radius: 0.25em;
            display: grid;
            place-content: center;
            transition: all 0.2s;
            cursor: pointer;
            flex-shrink: 0;
        }

        .custom-checkbox::before {
            content: "";
            width: 0.65em;
            height: 0.65em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        .custom-checkbox:checked {
            background-color: #3b82f6;
            border-color: #3b82f6;
        }

        .custom-checkbox:checked::before {
            transform: scale(1);
        }

        /* Mode Switcher */
        .mode-switch-btn {
            transition: all 0.3s;
        }
        .mode-switch-btn.active {
            background-color: #334155;
            color: #fff;
            border-color: #64748b;
        }
        /* Fusion specific header */
        .fusion-header {
            background: linear-gradient(90deg, #1e1b4b 0%, #312e81 100%);
            border-radius: 0.5rem;
            border: 1px solid #4f46e5;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.55);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(148, 163, 184, 0.16);
            box-shadow: 0 10px 25px rgba(2, 6, 23, 0.32);
        }

        .extension-chip {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 9999px;
            border: 1px solid rgba(99, 102, 241, 0.5);
            background: rgba(67, 56, 202, 0.25);
            color: #c7d2fe;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-700 p-4 shadow-lg z-10">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-gamepad text-3xl text-blue-500"></i>
                <div>
                    <h1 class="text-xl font-bold tracking-wider text-white">GAMEPROMPT <span class="text-blue-500">FORGE</span></h1>
                    <p class="text-xs text-slate-400">AI 游戏复刻提示词构建引擎</p>
                </div>
            </div>
            <div class="flex gap-4 text-sm">
                <a href="#" class="text-slate-400 hover:text-white transition"><i class="fa-brands fa-github"></i> Version 3.0 (Fusion)</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex overflow-hidden">

        <!-- Left Panel: Configuration -->
        <div class="w-2/3 flex flex-col border-r border-slate-700 bg-slate-800/50 overflow-y-auto custom-scrollbar p-6">

            <!-- 1. Category Selection -->
            <div class="mb-4">
                <h2 class="text-sm font-bold text-slate-400 uppercase mb-3 tracking-wider"><i class="fa-solid fa-layer-group mr-2"></i>游戏分类</h2>
                <div class="flex flex-wrap gap-2 border-b border-slate-700 pb-2" id="category-container">
                    <!-- Categories will be injected here -->
                </div>
            </div>

            <!-- 2. Game Selection Area -->
            <div class="mb-8">
                <!-- Mode Switcher -->
                <div class="flex items-center justify-between mb-4">
                     <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider"><i class="fa-solid fa-list mr-2"></i>选择游戏</h2>
                     <div class="flex bg-slate-900 rounded p-1 border border-slate-700">
                         <button id="mode-single" class="mode-switch-btn active px-4 py-1 text-xs rounded text-slate-400 font-bold hover:text-white" onclick="setMode('single')">
                             <i class="fa-solid fa-user mr-1"></i> 单体复刻
                         </button>
                         <button id="mode-fusion" class="mode-switch-btn px-4 py-1 text-xs rounded text-slate-400 font-bold hover:text-white" onclick="setMode('fusion')">
                             <i class="fa-solid fa-dna mr-1 text-purple-400"></i> 融合进化
                         </button>
                     </div>
                </div>

                <!-- Fusion Controls (Only visible in fusion mode) -->
                <div id="fusion-controls" class="hidden mb-4">
                    <div class="fusion-header p-3 mb-3 relative overflow-hidden">

                        </div>
                        <div id="selected-games-list" class="flex flex-wrap gap-2 min-h-[30px] relative z-10">

                        </div>

                        <!-- Fusion Strategy -->
                        <div class="mt-3 pt-2 border-t border-indigo-500/30 flex gap-4 text-xs text-indigo-200">
                             <label class="flex items-center cursor-pointer hover:text-white">
                                 <input type="radio" name="fusion-strat" value="equal" checked class="mr-1 accent-indigo-500">
                                 <span>⚖️ 均衡融合 (复刻还原所有内容)</span>
                             </label>
                             <label class="flex items-center cursor-pointer hover:text-white" title="以第一个选择的游戏为主体">

                                 <span>👑 主体融合 (以首选为主体)</span>
                             </label>
                        </div>
                    </div>
                </div>

                <!-- Search & Custom Input -->

                    </div>
                    <div class="relative w-1/3">
                        <input type="text" id="custom-game-input" placeholder="输入自定义游戏..."

                <!-- Game Grid -->
                <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2 max-h-60 overflow-y-auto pr-2 custom-scrollbar" id="games-grid">

            </div>

                <div class="grid grid-cols-3 gap-3" id="complexity-grid">
                    <!-- Levels injected here -->
                </div>
            </div>

            <!-- 4. Modifiers (Version, Style & Tech) -->
            <div class="grid grid-cols-3 gap-4 mb-6">
                 <div>
                    <h2 class="text-sm font-bold text-slate-400 uppercase mb-3 tracking-wider"><i class="fa-solid fa-code-branch mr-2"></i>游戏版本</h2>
                    <select id="game-version" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm focus:border-blue-500 outline-none">
                        <option value="">🚫 原版 (无需额外提示)</option>
                        <option value="simplified">✨ 简化版 (Simplified)</option>
                        <option value="extended">➕ 扩展版 (Extended)</option>
                        <option value="specialized">🎯 特化版 (Specialized)</option>
                        <option value="modded">🛠️ 魔改版 (Modded)</option>
                        <option value="2d">🟦 2D 版本 (2D Edition)</option>
                        <option value="3d">🧊 3D 版本 (3D Edition)</option>
                        <option value="pixel">👾 像素重制版 (Pixel Remake)</option>
                        <option value="demake">📉 复古降级版 (Demake)</option>
                        <option value="webgl">🚀 WebGL 加强版</option>
                        <option value="text">📄 纯文字版 (Text Based)</option>
                        <option value="mobile">📱 移动端竖屏版</option>
                    </select>
                </div>
                <div>
                    <h2 class="text-sm font-bold text-slate-400 uppercase mb-3 tracking-wider"><i class="fa-solid fa-palette mr-2"></i>视觉风格</h2>
                    <select id="visual-style" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm focus:border-blue-500 outline-none">
                        <option value="">🚫 默认/不指定</option>
                        <option value="original">🛡️ 忠实还原原作 (Authentic)</option>
                        <option value="neon">🌆 赛博朋克霓虹 (Cyberpunk Neon)</option>
                        <option value="pixel">👾 复古像素艺术 (Retro Pixel Art)</option>
                        <option value="minimal">⚪ 极简主义现代 (Minimalist Modern)</option>
                        <option value="ascii">💻 极客 ASCII 字符 (ASCII Terminal)</option>
                        <option value="sketch">✏️ 手绘草图风格 (Hand-Drawn Sketch)</option>
                        <option value="dark">🌑 暗黑模式 UI (Dark Mode UI)</option>
                    </select>
                </div>
                <div>
                    <h2 class="text-sm font-bold text-slate-400 uppercase mb-3 tracking-wider"><i class="fa-solid fa-code mr-2"></i>技术栈倾向</h2>
                    <select id="tech-stack" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-sm focus:border-blue-500 outline-none">

                        <button data-preset="balanced" class="extension-preset-btn text-[11px] px-2 py-1 rounded border border-indigo-600 text-indigo-200 hover:bg-indigo-700/40 transition">平衡扩展</button>

                    <label class="text-xs text-indigo-200 block mb-1">扩展强度</label>
                    <input id="extension-intensity" type="range" min="1" max="3" step="1" value="2" class="w-full accent-indigo-500">
                    <div class="mt-3">
                        <label for="extension-custom-note" class="text-xs text-indigo-200 block mb-1">自定义扩展指令</label>
                        <textarea id="extension-custom-note" rows="2" placeholder="例如：加入 roguelite 随机事件与赛季主题循环..." class="w-full bg-slate-900 border border-indigo-700/40 rounded p-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500 resize-none"></textarea>
                    </div>
                </div>
            </div>

             <!-- 5. General Requirements (Customizable) -->
            <div class="mb-6">
                <div class="flex justify-between items-center mb-3">
                     <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider"><i class="fa-solid fa-list-check mr-2"></i>通用要求 (General)</h2>
                     <button id="toggle-all-reqs" class="text-[10px] text-blue-400 hover:text-blue-300 font-bold">全选 / 全不选</button>
                </div>

                <div class="flex gap-2 mb-3">
                    <input type="text" id="new-req-input" placeholder="添加自定义要求 (如: 必须包含背景音乐)..."
                        class="flex-1 bg-slate-900 border border-slate-600 rounded px-3 py-1 text-xs text-white focus:outline-none focus:border-blue-500 transition">
                    <button id="add-req-btn" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded text-xs font-bold transition">
                        <i class="fa-solid fa-plus"></i> 添加
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-y-2 gap-x-4 p-3 bg-slate-900 rounded border border-slate-700" id="requirements-grid">
                    <!-- Checkboxes injected here -->
                </div>
            </div>

        </div>

        <!-- Right Panel: Output & Preview -->
        <div class="w-1/3 bg-slate-900 flex flex-col p-6 shadow-inner">
            <h2 class="text-sm font-bold text-blue-400 uppercase mb-4 tracking-wider flex items-center justify-between">
                <span><i class="fa-solid fa-terminal mr-2"></i>生成的提示词 (Prompt)</span>
                <span id="token-estimate" class="text-xs text-slate-500 font-normal">Est. output: Medium</span>
            </h2>

            <div class="flex-1 relative mb-4 group">
                <textarea id="output-prompt"
                    class="w-full h-full bg-slate-800 text-slate-300 p-4 rounded-lg border border-slate-700 mono-font text-sm focus:outline-none focus:border-blue-500 resize-none leading-relaxed"
                    readonly></textarea>
                <div class="absolute bottom-4 right-4 opacity-0 group-hover:opacity-100 transition duration-300">
                    <button id="copy-btn" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded shadow-lg text-sm font-bold flex items-center gap-2">
                        <i class="fa-regular fa-copy"></i> 复制提示词
                    </button>
                </div>
            </div>

            <!-- Saved/History Section -->
            <div class="h-1/3 border-t border-slate-800 pt-4 flex flex-col">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-xs font-bold text-slate-500 uppercase">历史记录</h3>
                    <button id="clear-history" class="text-xs text-red-400 hover:text-red-300">清空</button>
                </div>
                <div id="history-list" class="flex-1 overflow-y-auto custom-scrollbar space-y-2">
                    <!-- History items -->
                    <div class="text-slate-600 text-xs text-center mt-4">暂无历史记录</div>
                </div>
            </div>
        </div>

    </main>

        // --- 4. Render Functions ---

        function setMode(mode) {
            state.mode = mode;
            if (mode === 'single') {
                modeSingleBtn.classList.add('active');
                modeFusionBtn.classList.remove('active');
                fusionControls.classList.add('hidden');
            } else {
                modeSingleBtn.classList.remove('active');
                modeFusionBtn.classList.add('active');
                fusionControls.classList.remove('hidden');
                renderSelectedGames();
            }
            renderGames(); // Re-render to update chip styles
            updatePrompt();
        }

        function renderSelectedGames() {
            selectedGamesList.innerHTML = '';
            fusionCount.innerText = `${state.selectedGames.length}/5`;

            if (state.selectedGames.length === 0) {
                selectedGamesList.innerHTML = '<span class="text-xs text-indigo-400/50 italic py-1">点击下方游戏进行添加...</span>';
                return;
            }

            state.selectedGames.forEach(game => {
                const chip = document.createElement('div');
                chip.className = 'bg-indigo-600 text-white text-[10px] px-2 py-1 rounded flex items-center gap-2 shadow-sm animate-fade-in';
                chip.innerHTML = `
                    <span>${game}</span>
                    <button class="hover:text-red-300 transition" onclick="removeSelectedGame('${game}')">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                `;
                selectedGamesList.appendChild(chip);
            });
        }

        // Global function for onclick in HTML string
        window.removeSelectedGame = (game) => {
            state.selectedGames = state.selectedGames.filter(g => g !== game);
            renderSelectedGames();
            renderGames(); // Update visual state of grid
            updatePrompt();
        };

        function renderCategories() {
            categoryContainer.innerHTML = '';
            Object.keys(gamesDB).forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `category-btn text-xs font-bold px-3 py-2 text-slate-400 hover:text-white transition ${state.category === cat ? 'active' : ''}`;
                btn.innerText = cat;
                btn.onclick = () => {
                    state.category = cat;
                    if (state.mode === 'single') {
                        state.game = gamesDB[cat][0];
                        state.isCustomGame = false;
                        customInput.value = '';
                    }
                    searchInput.value = '';
                    renderCategories();
                    renderGames();
                    updatePrompt();
                };
                categoryContainer.appendChild(btn);
            });
        }

        function renderGames() {
            gamesGrid.innerHTML = '';
            const searchTerm = searchInput.value.toLowerCase().trim();

            let gamesToShow = [];

            if (searchTerm) {
                Object.keys(gamesDB).forEach(cat => {
                    gamesDB[cat].forEach(game => {
                        if (game.toLowerCase().includes(searchTerm)) {
                            gamesToShow.push({ name: game, category: cat });
                        }
                    });
                });
            } else {
                gamesToShow = gamesDB[state.category].map(g => ({ name: g, category: state.category }));
            }

            if (gamesToShow.length === 0) {
                gamesGrid.innerHTML = '<div class="col-span-full text-center text-slate-500 text-xs py-4">未找到匹配游戏</div>';
                return;
            }

            gamesToShow.forEach(item => {
                const btn = document.createElement('button');
                const name = item.name;

                // Styling Logic based on Mode
                let isSelected = false;
                let isFusionSelected = false;

                if (state.mode === 'single') {
                    isSelected = !state.isCustomGame && state.game === name;
                } else {
                    isFusionSelected = state.selectedGames.includes(name);
                }

                let baseClass = `game-chip text-left text-xs p-2 rounded border border-slate-700 bg-slate-800 text-slate-300`;
                if (isSelected) baseClass += ' active';
                else if (isFusionSelected) baseClass += ' fusion-selected';
                else baseClass += ' hover:bg-slate-700';

                btn.className = baseClass;

                if (searchTerm) {
                    btn.innerHTML = `<span class="text-[10px] text-slate-500 block mb-1">${item.category}</span>${name}`;
                } else {
                    btn.innerText = name;
                }

                btn.onclick = () => {
                    if (state.mode === 'single') {
                        state.game = name;
                        state.isCustomGame = false;
                        customInput.value = '';
                        if (state.category !== item.category) {
                            state.category = item.category;
                            renderCategories();
                        }
                    } else {
                        // Fusion Mode Toggle
                        if (state.selectedGames.includes(name)) {
                            state.selectedGames = state.selectedGames.filter(g => g !== name);
                        } else {
                            if (state.selectedGames.length >= 5) {
                                alert("融合模式最多支持5个游戏！");
                                return;
                            }
                            state.selectedGames.push(name);
                        }
                        renderSelectedGames();
                    }
                    renderGames();
                    updatePrompt();
                };
                gamesGrid.appendChild(btn);
            });
        }

        function renderComplexity() {
            complexityGrid.innerHTML = '';

                const isActive = state.complexity === level.id;
                div.className = `level-card p-3 rounded bg-slate-800 ${isActive ? 'active' : ''}`;
                if (level.id === 'raw') div.setAttribute('data-id', 'raw');

                div.innerHTML = `
                    <div class="font-bold text-white text-xs mb-1">${level.label}</div>
                    <div class="text-[10px] text-slate-400 leading-tight">${level.desc}</div>
                `;
                div.onclick = () => {
                    state.complexity = level.id;
                    renderComplexity();
                    updatePrompt();
                };
                complexityGrid.appendChild(div);
            });
        }

        function renderRequirements() {
            requirementsGrid.innerHTML = '';
            generalRequirements.forEach(req => {
                const label = document.createElement('label');
                label.className = 'flex items-center space-x-2 text-xs text-slate-300 cursor-pointer hover:text-white transition group';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'custom-checkbox';
                checkbox.checked = state.requirements.includes(req.id);

                checkbox.onchange = (e) => {
                    if (e.target.checked) {
                        state.requirements.push(req.id);
                    } else {
                        state.requirements = state.requirements.filter(id => id !== req.id);
                    }
                    updatePrompt();
                };

                const span = document.createElement('span');
                span.innerText = req.label;
                span.className = 'select-none group-hover:text-blue-300 transition-colors truncate';
                span.title = req.text;

                label.appendChild(checkbox);
                label.appendChild(span);
                requirementsGrid.appendChild(label);
            });
        }

        function shouldShowExtensionPanel() {
            return ['extended', 'modded', 'specialized'].includes(state.version);
        }

        function saveExtensionConfig() {
            const payload = {
                selected: state.extensionFeatures,
                intensity: state.extensionIntensity,
                customNote: state.customExtensionNote
            };
            localStorage.setItem('extension_feature_config_v1', JSON.stringify(payload));
        }

        function loadExtensionConfig() {
            try {
                const raw = localStorage.getItem('extension_feature_config_v1');
                if (!raw) return;
                const parsed = JSON.parse(raw);
                state.extensionFeatures = Array.isArray(parsed.selected) ? parsed.selected : [];
                state.extensionIntensity = Number(parsed.intensity) || 2;
                state.customExtensionNote = typeof parsed.customNote === 'string' ? parsed.customNote : "";
            } catch (_) {
                state.extensionFeatures = [];
                state.extensionIntensity = 2;
                state.customExtensionNote = "";
            }
        }

        function getExtensionIntensityText(level) {
            if (Number(level) === 1) return '轻量';
            if (Number(level) === 3) return '激进';
            return '平衡';
        }

        function applyExtensionPreset(preset) {
            const ids = extensionFeatures.map(f => f.id);
            if (preset === 'lite') {
                state.extensionFeatures = ['assist', 'juice'];
                state.extensionIntensity = 1;
            } else if (preset === 'balanced') {
                state.extensionFeatures = ['meta', 'challenge', 'mode', 'juice'];
                state.extensionIntensity = 2;
            } else if (preset === 'aggressive') {
                state.extensionFeatures = ids;
                state.extensionIntensity = 3;
            } else if (preset === 'random') {
                state.extensionFeatures = ids.filter(() => Math.random() > 0.45);
                if (state.extensionFeatures.length === 0) state.extensionFeatures = [ids[Math.floor(Math.random() * ids.length)]];
                state.extensionIntensity = Math.floor(Math.random() * 3) + 1;
            }
            saveExtensionConfig();
            renderExtensionPanel();
            updatePrompt();
        }

        function renderExtensionPanel() {
            const visible = shouldShowExtensionPanel();
            extensionPanel.classList.toggle('hidden', !visible);
            if (!visible) return;

            extensionFeaturesGrid.innerHTML = '';
            extensionFeatures.forEach(feature => {
                const active = state.extensionFeatures.includes(feature.id);
                const btn = document.createElement('button');
                btn.className = `text-xs rounded border p-2 text-left transition ${active ? 'bg-indigo-600 border-indigo-400 text-white' : 'bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700'}`;
                btn.innerHTML = `<div class="font-bold mb-1">${feature.label}</div><div class="text-[10px] opacity-80">${feature.text}</div>`;
                btn.onclick = () => {
                    if (state.extensionFeatures.includes(feature.id)) {
                        state.extensionFeatures = state.extensionFeatures.filter(id => id !== feature.id);
                    } else {
                        state.extensionFeatures.push(feature.id);
                    }
                    saveExtensionConfig();
                    renderExtensionPanel();
                    updatePrompt();
                };
                extensionFeaturesGrid.appendChild(btn);
            });

            extensionSummary.innerHTML = '';
            if (state.extensionFeatures.length === 0) {
                extensionSummary.innerHTML = '<span class="text-[10px] text-indigo-300/70 italic">尚未选择扩展项</span>';
            } else {
                state.extensionFeatures.forEach(featureId => {
                    const item = extensionFeatures.find(f => f.id === featureId);
                    if (!item) return;
                    const chip = document.createElement('span');
                    chip.className = 'extension-chip';
                    chip.innerText = item.label;
                    extensionSummary.appendChild(chip);
                });
            }

            extensionIntensityInput.value = state.extensionIntensity;
            extensionIntensityLabel.innerText = `强度：${getExtensionIntensityText(state.extensionIntensity)}`;
            extensionCustomNoteInput.value = state.customExtensionNote;
        }

        // --- 5. Logic & Prompt Generation ---

        function getComplexityInstructions(level) {
            const instructions = {
                raw: "",
                simple: "Keep the code simple and readable. Focus solely on the core gameplay loop. Use basic colored rectangles for graphics. No external assets.",
                normal: "Include a Start Screen, Game Over Screen, and Score tracking. Use basic sound effects (synthesized using AudioContext). Ensure controls are responsive.",
                advanced: "Implement a polished UI with CSS animations. Add particle effects for interactions (explosions, collecting items). Save high scores to LocalStorage. Support both Keyboard and Touch controls for mobile.",
                complex: "Create a robust game state machine. Add screen shake, detailed particle systems, and difficulty scaling over time. If applicable, add simple AI behaviors. The code should be well-structured with comments.",
                professional: "Structure the code using clean classes/modules within the single file. Use requestAnimationFrame for the loop. Generate SVG assets programmatically for crisp graphics. Ensure strict type checking (JSDoc) and error handling.",
                extreme: "PUSH THE LIMITS. Use WebGL shaders or advanced Canvas compositing for visuals if needed. Add 'juice' (tweening, heavy feedback). Procedural generation for infinite replayability. A comprehensive, production-ready mini-game."
            };
            return instructions[level];
        }

        function getStyleInstructions(style) {
            if (!style) return "";
            const styles = {
                original: "Replicate the original visual style of the game as closely as possible using CSS/Canvas primitives.",
                neon: "Use a 'Cyberpunk' visual style: dark backgrounds (#000), neon glowing lines (box-shadow/glow), and futuristic fonts.",
                pixel: "Simulate a retro 8-bit aesthetic. Use blocky fonts (import a Google Font like 'Press Start 2P') and pixel-aligned graphics.",
                minimal: "Use a clean, Apple-like 'Flat Design'. Soft pastel colors, rounded corners, subtle shadows, and sans-serif typography.",
                ascii: "Render the entire game using ASCII characters within a <pre> tag or monospace font canvas. No standard shapes, only text.",
                sketch: "Make the game look like a hand-drawn doodle on paper. Use rough lines, white background, and 'pencil' colors.",
                dark: "Use a high-contrast Dark Mode theme suitable for night gaming. Slate/Zinc color palette."
            };
            return styles[style];
        }

        function getTechInstructions(tech) {
            if (!tech) return "";
            if (tech === 'auto') return "Choose the best technical approach (Canvas API vs DOM manipulation) for this specific game type.";
            if (tech === 'canvas') return "You MUST use the HTML5 <canvas> API for all rendering. Do not use DOM elements for game objects.";
            if (tech === 'dom') return "You MUST use HTML DOM elements (divs, spans) for game objects. Manipulate them via CSS absolute positioning.";
            if (tech === 'svg') return "You MUST use SVG elements for rendering game entities to ensure perfect scaling.";
            if (tech === 'three') return "Use Three.js (via CDN) to create a 3D version or 2.5D version of this concept.";
            return "";
        }

        function generatePrompt() {
            let prompt = "";
            let promptIntro = ""; // The main descriptive sentence

            // --- 1. Construct the Intro Sentence based on Mode ---
            if (state.mode === 'single') {
                const gameName = state.isCustomGame ? customInput.value : state.game;
                const versionMap = {
                    '': '', 'simplified': ' (简化版)', 'extended': ' (扩展版)', 'specialized': ' (特化版)', 'modded': ' (魔改版)',
                    '2d': ' (2D版)', '3d': ' (3D版)', 'pixel': ' (像素版)', 'demake': ' (复古降级版)', 'webgl': ' (WebGL版)',
                    'text': ' (纯文字版)', 'mobile': ' (移动端竖屏版)'
                };
                const effectiveName = `${gameName}${versionMap[state.version] || ''}`;

                if (state.complexity === 'raw') {
                    promptIntro = `帮我写一个单html文件的《${effectiveName}》游戏，尽可能尽全力去复刻还原《${effectiveName}》的游戏内容。`;
                } else {
                    promptIntro = `帮我写一个单HTML文件的《${effectiveName}》游戏。\n\n**目标**: 尽可能尽全力去复刻还原《${effectiveName}》的游戏内容，同时确保代码在一个独立的HTML文件中（包含CSS, JS）。`;
                }

            } else {
                // FUSION MODE
                const games = state.selectedGames;
                if (games.length === 0) {
                    return "请至少选择一个游戏进行融合...";
                }

                if (state.fusionStrategy === 'equal') {
                    // Template 1: Equal Merge
                    // Format: A和B、C、D...
                    let gameListStr = "";
                    if (games.length === 1) {
                        gameListStr = `《${games[0]}》`;
                    } else {
                        const first = games[0];
                        const others = games.slice(1).join("》、《");
                        gameListStr = `《${first}》和《${others}》`;
                    }
                    promptIntro = `帮我写一个单html文件的游戏，把${gameListStr}融合成一个游戏，尽可能尽全力去复刻还原它们的的游戏内容进行一个融合成一个新的游戏。`;

                } else {
                    // Template 2: Main Base Merge
                    const gameListStr = games.join("》和《");
                    const mainGame = games[0];
                    promptIntro = `帮我写一个单html文件的游戏，把《${gameListStr}》融合成一个游戏，尽可能尽全力去复刻还原它们的的游戏内容进行一个融合成一个新的游戏，以《${mainGame}》这个游戏为主体进行融合构建。`;
                }
            }

            // --- 2. Assemble Final Prompt ---

            // Raw Complexity Handling
            if (state.complexity === 'raw') {
                tokenEstimate.innerText = "Complexity: Raw Template";
                prompt = promptIntro;

                // Append requirements even in raw mode if they exist
                if (state.requirements.length > 0) {
                    prompt += `\n\n**通用要求**:\n`;
                    state.requirements.forEach(reqId => {
                        const req = generalRequirements.find(r => r.id === reqId);
                        if (req) prompt += `- ${req.text}\n`;
                    });
                }
                return prompt;
            }

            // Standard Complexity Handling
            prompt = promptIntro + "\n\n";

            // If fusion mode, manually ensure the "Single HTML" constraint is reinforced if the template didn't emphasize it enough for the AI context
            if (state.mode === 'fusion') {
                 prompt += `**目标**: 创建一个独特的融合游戏体验，同时确保代码在一个独立的HTML文件中（包含CSS, JS）。\n\n`;
            }

            const complexityText = getComplexityInstructions(state.complexity);
            const styleText = getStyleInstructions(state.visualStyle);
            const techText = getTechInstructions(state.techStack);

            prompt += `**设计要求 (${state.complexity.toUpperCase()})**:\n`;
            prompt += `- ${complexityText}\n`;

            if (styleText) {
                prompt += `\n**视觉风格**:\n`;
                prompt += `- ${styleText}\n`;
            }

            if (techText) {
                prompt += `\n**技术栈限制**:\n`;
                prompt += `- ${techText}\n`;
            }

            if (shouldShowExtensionPanel() && (state.extensionFeatures.length > 0 || state.customExtensionNote.trim())) {
                prompt += `\n**扩展功能优化**:\n`;
                prompt += `- 扩展强度：${getExtensionIntensityText(state.extensionIntensity)}。\n`;
                state.extensionFeatures.forEach(featureId => {
                    const item = extensionFeatures.find(f => f.id === featureId);
                    if (item) prompt += `- ${item.text}\n`;
                });
                if (state.customExtensionNote.trim()) {
                    prompt += `- 自定义扩展：${state.customExtensionNote.trim()}\n`;
                }
            }

            // Dynamic Requirements
            if (state.requirements.length > 0) {
                prompt += `\n**通用要求**:\n`;
                state.requirements.forEach(reqId => {
                    const req = generalRequirements.find(r => r.id === reqId);
                    if (req) prompt += `- ${req.text}\n`;
                });
            }

            // Estimate Quality
            const levelMap = {raw: "Minimal", simple: "Low", normal: "Medium", advanced: "High", complex: "Very High", professional: "Ultra", extreme: "Maximum"};
            tokenEstimate.innerText = `Complexity: ${levelMap[state.complexity]}`;

            return prompt;
        }

        function updatePrompt() {
            const p = generatePrompt();
            outputPrompt.value = p;
        }

        function addNewRequirement() {
            const val = newReqInput.value.trim();
            if (!val) return;

            const id = `custom_${Date.now()}`;
            // Add to data source
            generalRequirements.push({
                id: id,
                label: `✨ ${val}`, // Short label
                text: val // Full text for prompt
            });

            // Auto-select the new requirement
            state.requirements.push(id);

            // Re-render
            renderRequirements();
            updatePrompt();

            // Clear input
            newReqInput.value = '';
        }

        // --- 6. Event Listeners ---

        searchInput.addEventListener('input', (e) => {
            renderGames();
        });

        // Fusion Strategy Radio Listeners
        document.querySelectorAll('input[name="fusion-strat"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                state.fusionStrategy = e.target.value;
                updatePrompt();
            });
        });

        customInput.addEventListener('input', (e) => {
            const val = e.target.value.trim();
            if (val.length > 0) {
                if (state.mode === 'single') {
                     state.isCustomGame = true;
                     document.querySelectorAll('.game-chip').forEach(el => el.classList.remove('active'));
                }
            } else {
                state.isCustomGame = false;
                renderGames();
            }
            updatePrompt();
        });

        // Enter key on custom input for Fusion Mode
        customInput.addEventListener('keypress', (e) => {
            if (state.mode === 'fusion' && e.key === 'Enter') {
                const val = e.target.value.trim();
                if (val) {
                    if (!state.selectedGames.includes(val)) {
                         if (state.selectedGames.length >= 5) {
                            alert("融合模式最多支持5个游戏！");
                            return;
                        }
                        state.selectedGames.push(val);
                        renderSelectedGames();
                        updatePrompt();
                    }
                    customInput.value = '';
                }
            }
        });

        gameVersionSelect.addEventListener('change', (e) => {
            state.version = e.target.value;
            if (!shouldShowExtensionPanel()) {
                state.extensionFeatures = [];
            }
            renderExtensionPanel();
            updatePrompt();
        });

        visualStyleSelect.addEventListener('change', (e) => {
            state.visualStyle = e.target.value;
            updatePrompt();
        });

        techStackSelect.addEventListener('change', (e) => {
            state.techStack = e.target.value;
            updatePrompt();
        });

        extensionIntensityInput.addEventListener('input', (e) => {
            state.extensionIntensity = Number(e.target.value);
            extensionIntensityLabel.innerText = `强度：${getExtensionIntensityText(state.extensionIntensity)}`;
            saveExtensionConfig();
            updatePrompt();
        });

        document.querySelectorAll('.extension-preset-btn').forEach(btn => {
            btn.addEventListener('click', () => applyExtensionPreset(btn.dataset.preset));
        });

        extensionCustomNoteInput.addEventListener('input', (e) => {
            state.customExtensionNote = e.target.value;
            saveExtensionConfig();
            updatePrompt();
        });

        extensionResetBtn.addEventListener('click', () => {
            state.extensionFeatures = [];
            state.extensionIntensity = 2;
            state.customExtensionNote = "";
            saveExtensionConfig();
            renderExtensionPanel();
            updatePrompt();
        });

        toggleReqsBtn.addEventListener('click', () => {
            if (state.requirements.length > 0) {
                // Deselect all
                state.requirements = [];
            } else {
                // Select all
                state.requirements = generalRequirements.map(r => r.id);
            }
            renderRequirements();
            updatePrompt();
        });

        // Add Req Events
        addReqBtn.addEventListener('click', addNewRequirement);
        newReqInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addNewRequirement();
        });

        // Copy & History Logic
        function saveToHistory(prompt, title) {
            let history = JSON.parse(localStorage.getItem('prompt_history') || '[]');
            const timestamp = new Date().toLocaleTimeString();
            history.unshift({ title, prompt, time: timestamp });
            if (history.length > 10) history.pop();
            localStorage.setItem('prompt_history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('prompt_history') || '[]');
            historyList.innerHTML = '';
            if (history.length === 0) {
                historyList.innerHTML = '<div class="text-slate-600 text-xs text-center mt-4">暂无历史记录</div>';
                return;
            }
            history.forEach(item => {
                const div = document.createElement('div');
                div.className = "bg-slate-800 p-2 rounded border border-slate-700 hover:border-blue-500 cursor-pointer group";
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-blue-400 font-bold truncate w-32">${item.title}</span>
                        <span class="text-[10px] text-slate-500">${item.time}</span>
                    </div>
                    <div class="text-[10px] text-slate-400 truncate">${item.prompt.substring(0, 50)}...</div>
                `;
                div.onclick = () => {
                    outputPrompt.value = item.prompt;
                    div.style.backgroundColor = '#1e293b';
                    setTimeout(() => div.style.backgroundColor = '', 200);
                };
                historyList.appendChild(div);
            });
        }

        copyBtn.addEventListener('click', () => {
            outputPrompt.select();
            document.execCommand('copy');
            const originalText = copyBtn.innerHTML;
            copyBtn.innerHTML = `<i class="fa-solid fa-check"></i> 已复制`;
            copyBtn.classList.replace('bg-blue-600', 'bg-green-600');
            copyBtn.classList.replace('hover:bg-blue-500', 'hover:bg-green-500');

            // Construct title for history
            let gameName = "";
            if (state.mode === 'single') {
                 gameName = state.isCustomGame ? customInput.value : state.game;
                 if (state.version) {
                     const versionMap = {
                        'simplified': ' (Simple)', 'extended': ' (Ext)', 'specialized': ' (Spec)', 'modded': ' (Mod)',
                        '2d': ' (2D)', '3d': ' (3D)', 'pixel': ' (Px)',
                        'demake': ' (Old)', 'webgl': ' (GL)', 'text': ' (Txt)', 'mobile': ' (Mob)'
                    };
                    gameName += versionMap[state.version] || '';
                }
            } else {
                gameName = `融合: ${state.selectedGames.join('+')}`;
            }

            saveToHistory(outputPrompt.value, gameName);

            setTimeout(() => {
                copyBtn.innerHTML = originalText;
                copyBtn.classList.replace('bg-green-600', 'bg-blue-600');
                copyBtn.classList.replace('hover:bg-green-500', 'hover:bg-blue-500');
            }, 2000);
        });

        clearHistoryBtn.addEventListener('click', () => {
            localStorage.removeItem('prompt_history');
            renderHistory();
        });

        // --- 7. Initialization ---
        setMode('single'); // Initialize
        loadExtensionConfig();
        renderCategories();
        renderGames();
        renderComplexity();
        renderRequirements();
        renderExtensionPanel();
        renderHistory();
        updatePrompt();

    </script>
</body>
</html>
